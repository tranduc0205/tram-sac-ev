<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Sạc Xe Điện Thông Minh</title>
    
    <!-- Nhúng Firebase SDK (v8 Compatibility) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #eef2f5; padding: 20px; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 16px; max-width: 400px; margin: 20px auto; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        h2 { color: #1a252f; margin-bottom: 20px; }
        .step-title { font-weight: bold; color: #34495e; text-align: left; margin-top: 15px; font-size: 14px; }
        .btn-group { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; }
        .btn { flex: 1; padding: 12px; border: 2px solid #007bff; background: white; color: #007bff; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn.active { background: #007bff; color: white; }
        .btn-time { border-color: #28a745; color: #28a745; }
        .btn-time.active { background: #28a745; color: white; }
        .summary-box { background: #e8f4ea; padding: 12px; border-radius: 10px; margin-top: 15px; color: #1e7e34; font-weight: bold; }
        img { width: 240px; margin-top: 15px; border-radius: 10px; border: 1px solid #ddd; }
        .note { font-size: 12px; color: #7f8c8d; margin-top: 8px; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 10px; }
        .status-off { background: #ffebee; color: #c62828; }
        .status-on { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>

<div class="box">
    <h2>⚡ TRẠM SẠC XE ĐIỆN</h2>
    
    <!-- BƯỚC 1: CHỌN CỔNG SẠC -->
    <div class="step-title">1. CHỌN CỔNG SẠC:</div>
    <div class="btn-group">
        <button class="btn btn-port" id="btn-p1" onclick="selectPort(1)">🔌 CỔNG 1</button>
        <button class="btn btn-port" id="btn-p2" onclick="selectPort(2)">🔌 CỔNG 2</button>
    </div>

    <!-- BƯỚC 2: CHỌN SỐ GIỜ SẠC -->
    <div class="step-title">2. CHỌN THỜI GIAN SẠC:</div>
    <div class="btn-group">
        <button class="btn btn-time" id="btn-t1" onclick="selectTime(1)">1 Giờ</button>
        <button class="btn btn-time" id="btn-t2" onclick="selectTime(2)">2 Giờ</button>
        <button class="btn btn-time" id="btn-t3" onclick="selectTime(3)">3 Giờ</button>
        <button class="btn btn-time" id="btn-t5" onclick="selectTime(5)">5 Giờ</button>
    </div>

    <!-- BƯỚC 3: TỔNG TIỀN VÀ MÃ VIETQR -->
    <div id="qr-section" style="display:none;">
        <div class="summary-box" id="summary-text">
            Đã chọn: Cổng 1 | 1 Giờ -> 10.000 VNĐ
        </div>
        <p class="step-title" style="text-align:center;">3. QUÉT MÃ VIETQR ĐỂ THANH TOÁN:</p>
        <img id="img-qr" src="" alt="Mã VietQR">
        <div class="note">Hệ thống nhận tiền sẽ tự động bật sạc trong vòng 3 giây.</div>
    </div>
</div>

<script>
    // --- 1. CẤU HÌNH FIREBASE DATABASE ---
    const firebaseConfig = {
        databaseURL: "https://tram-sac-ev-iot-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // --- 2. THÔNG TIN NGÂN HÀNG & GIÁ TIỀN ---
    const BANK_ID = "MB";
    const ACCOUNT_NO = "0869183925";
    const ACCOUNT_NAME = "TRAN NGUYEN VIET DUC";
    const PRICE_PER_HOUR = 10000;

    let selectedPort = null;
    let selectedHours = null;

    function selectPort(port) {
        selectedPort = port;
        document.getElementById('btn-p1').classList.remove('active');
        document.getElementById('btn-p2').classList.remove('active');
        document.getElementById(`btn-p${port}`).classList.add('active');
        updateQR();
    }

    function selectTime(hours) {
        selectedHours = hours;
        [1, 2, 3, 5].forEach(h => {
            const btn = document.getElementById(`btn-t${h}`);
            if (btn) btn.classList.remove('active');
        });
        document.getElementById(`btn-t${hours}`).classList.add('active');
        updateQR();
    }

    function updateQR() {
        if (selectedPort !== null && selectedHours !== null) {
            const totalAmount = selectedHours * PRICE_PER_HOUR;
            const memo = selectedPort === 1 ? "SAC01" : "SAC02";

            document.getElementById('summary-text').innerText = 
                `CỔNG ${selectedPort} | ${selectedHours} Giờ -> ${totalAmount.toLocaleString('vi-VN')} VNĐ`;

            const qrUrl = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-compact2.png?amount=${totalAmount}&addInfo=${memo}&accountName=${encodeURIComponent(ACCOUNT_NAME)}`;
            
            document.getElementById('img-qr').src = qrUrl;
            document.getElementById('qr-section').style.display = 'block';
        }
    }

    // --- 3. LẮNG NGHE WEBHOOK SEPAY VỀ FIREBASE ĐỂ TỰ ĐỘNG BẬT CỔNG ---
    database.ref('/').on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        // Tìm nội dung chuyển khoản trong gói dữ liệu SePAY gửi về gốc
        const content = data.content || (data.status && data.status.content) || "";

        if (content) {
            let portToEnable = null;
            
            if (content.includes('SAC01')) {
                portToEnable = 'Port1';
            } else if (content.includes('SAC02')) {
                portToEnable = 'Port2';
            }

            if (portToEnable) {
                // Thời gian đếm ngược mặc định (tính bằng giây) dựa trên giờ đã chọn hoặc mặc định 1 giờ (3600s)
                const durationSeconds = (selectedHours ? selectedHours : 1) * 3600;

                // Cập nhật trạng thái cổng sạc sang ON
                database.ref(`${portToEnable}/status`).set('ON');
                database.ref(`${portToEnable}/remaining_time`).set(durationSeconds);

                // Dọn dẹp các trường thông tin rác mà SePAY đẩy về gốc
                const fieldsToRemove = ['accountNumber', 'accumulated', 'content', 'description', 'gateway', 'id', 'referenceCode', 'transactionDate', 'transferAmount', 'transferType', 'code'];
                fieldsToRemove.forEach(field => {
                    database.ref(field).remove();
                });

                alert(`🎉 Thanh toán thành công! ${portToEnable === 'Port1' ? 'CỔNG 1' : 'CỔNG 2'} đã được kích hoạt.`);
            }
        }
    });
</script>

</body>
</html>
