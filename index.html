<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Sạc Xe Điện Thông Minh EV</title>
    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 450px; background: white; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 20px; }
        .btn-group { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .btn { padding: 12px 20px; font-weight: bold; border: 2px solid #007bff; background: white; color: #007bff; border-radius: 8px; cursor: pointer; transition: 0.3s; flex: 1; margin: 0 5px; }
        .btn.active { background: #007bff; color: white; }
        .btn-time { padding: 10px 15px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; margin: 3px; }
        .btn-time.active { background: #28a745; color: white; border-color: #28a745; }
        #qr-section { margin-top: 25px; display: none; padding: 15px; border-top: 1px solid #eee; }
        #img-qr { width: 230px; height: 230px; border: 1px solid #ddd; border-radius: 8px; padding: 5px; }
        .summary { margin-top: 10px; font-weight: bold; color: #d9534f; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔌 TRẠM SẠC XE ĐIỆN EV</h2>

    <p><strong>1. Chọn cổng sạc:</strong></p>
    <div class="btn-group">
        <button id="btn-p1" class="btn" onclick="selectPort(1)">🔌 CỔNG 1</button>
        <button id="btn-p2" class="btn" onclick="selectPort(2)">🔌 CỔNG 2</button>
    </div>

    <p><strong>2. Chọn thời gian sạc:</strong></p>
    <div>
        <button id="btn-t1" class="btn-time" onclick="selectTime(1)">1 Giờ (10k)</button>
        <button id="btn-t2" class="btn-time" onclick="selectTime(2)">2 Giờ (20k)</button>
        <button id="btn-t3" class="btn-time" onclick="selectTime(3)">3 Giờ (30k)</button>
        <button id="btn-t5" class="btn-time" onclick="selectTime(5)">5 Giờ (50k)</button>
    </div>

    <div id="qr-section">
        <p class="summary" id="summary-text"></p>
        <p>Quét mã VietQR để thanh toán:</p>
        <img id="img-qr" src="" alt="Mã VietQR Thanh Toán">
        <p style="font-size: 13px; color: #666; margin-top: 8px;">*(Hệ thống sẽ tự động kích hoạt ngay sau khi nhận tiền)*</p>
    </div>
</div>

<script>
    // --- 1. CẤU HÌNH FIREBASE DATABASE ---
    const firebaseConfig = {
        databaseURL: "https://tram-sac-ev-iot-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // --- 2. THÔNG TIN NGÂN HÀNG & GIÁ TIỀN ---
    const BANK_ID = "MB";
    const ACCOUNT_NO = "0869183925";
    const ACCOUNT_NAME = "TRAN NGUYEN VIET DUC";
    const PRICE_PER_HOUR = 10000;

    let selectedPort = null;
    let selectedHours = null;
    let portsStatus = { Port1: "OFF", Port2: "OFF" };

    // --- LẮNG NGHE TRẠNG THÁI REALTIME CỦA 2 CỔNG SẠC ---
    database.ref('Port1/status').on('value', (snapshot) => {
        portsStatus.Port1 = snapshot.val() || "OFF";
        updatePortUI(1);
    });

    database.ref('Port2/status').on('value', (snapshot) => {
        portsStatus.Port2 = snapshot.val() || "OFF";
        updatePortUI(2);
    });

    function updatePortUI(port) {
        const btn = document.getElementById(`btn-p${port}`);
        if (!btn) return;
        const status = portsStatus[`Port${port}`];

        if (status === "ON") {
            btn.style.background = "#dc3545";
            btn.style.borderColor = "#dc3545";
            btn.style.color = "white";
            btn.innerText = `🔌 CỔNG ${port} (ĐANG SẠC...)`;
            
            if (selectedPort === port) {
                document.getElementById('qr-section').style.display = 'none';
                alert(`⚠️ Cổng ${port} hiện đang có xe sạc. Vui lòng chọn cổng khác!`);
                selectedPort = null;
                btn.classList.remove('active');
            }
        } else {
            btn.style.background = "";
            btn.style.borderColor = "#007bff";
            btn.style.color = "#007bff";
            btn.innerText = `🔌 CỔNG ${port}`;
        }
    }

    function selectPort(port) {
        if (portsStatus[`Port${port}`] === "ON") {
            alert(`⛔ Cổng ${port} đang có xe sạc! Bạn vui lòng chọn cổng còn trống.`);
            return;
        }

        selectedPort = port;
        document.getElementById('btn-p1').classList.remove('active');
        document.getElementById('btn-p2').classList.remove('active');
        document.getElementById(`btn-p${port}`).classList.add('active');
        updateQR();
    }

    function selectTime(hours) {
        selectedHours = hours;
        [1, 2, 3, 5].forEach(h => {
            const btn = document.getElementById(`btn-t${h}`);
            if (btn) btn.classList.remove('active');
        });
        document.getElementById(`btn-t${hours}`).classList.add('active');
        updateQR();
    }

    function updateQR() {
        if (selectedPort !== null && selectedHours !== null) {
            if (portsStatus[`Port${selectedPort}`] === "ON") {
                document.getElementById('qr-section').style.display = 'none';
                return;
            }

            const totalAmount = selectedHours * PRICE_PER_HOUR;
            const memo = selectedPort === 1 ? "SAC01" : "SAC02";

            document.getElementById('summary-text').innerText = 
                `CỔNG ${selectedPort} | ${selectedHours} Giờ -> ${totalAmount.toLocaleString('vi-VN')} VNĐ`;

            const qrUrl = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-compact2.png?amount=${totalAmount}&addInfo=${memo}&accountName=${encodeURIComponent(ACCOUNT_NAME)}`;
            
            document.getElementById('img-qr').src = qrUrl;
            document.getElementById('qr-section').style.display = 'block';
        }
    }

    // --- LẮNG NGHE WEBHOOK SEPAY VỀ FIREBASE ---
    database.ref('/').on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const content = data.content || (data.status && data.status.content) || "";

        if (content) {
            let portToEnable = null;
            
            if (content.includes('SAC01')) {
                portToEnable = 'Port1';
            } else if (content.includes('SAC02')) {
                portToEnable = 'Port2';
            }

            if (portToEnable) {
                const durationSeconds = (selectedHours ? selectedHours : 1) * 3600;

                database.ref(`${portToEnable}/status`).set('ON');
                database.ref(`${portToEnable}/remaining_time`).set(durationSeconds);

                const fieldsToRemove = ['accountNumber', 'accumulated', 'content', 'description', 'gateway', 'id', 'referenceCode', 'transactionDate', 'transferAmount', 'transferType', 'code'];
                fieldsToRemove.forEach(field => {
                    database.ref(field).remove();
                });

                alert(`🎉 Thanh toán thành công! ${portToEnable === 'Port1' ? 'CỔNG 1' : 'CỔNG 2'} đã được kích hoạt.`);
            }
        }
    });
</script>
</body>
</html>
